<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E53935;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BF360C;stop-opacity:1" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="var(--bg)" opacity="0.3"/>
  
  <!-- Main abstract AI icon -->
  <g filter="url(#logoGlow)">
    <!-- Circuit-like pattern representing AI/neural networks -->
    <path d="M36 44c0-5 4-8 8-8h8c5 0 8 3 8 8v16c0 5-4 8-8 8h-8c-5 0-8-3-8-8V44z" fill="url(#logoGradient)"/>
    <circle cx="60" cy="60" r="12" fill="white"/>
    <line x1="24" y1="44" x2="36" y2="56"/>
    <line x1="84" y1="44" x2="72" y2="56"/>
    <line x1="24" y1="76" x3="48" y2="56" x2="36"/>
    <line x1="84" y1="76" x3="72" y2="56" x2="84"/>
    <circle cx="24" cy="60" r="4" fill="white"/>
    <circle cx="96" cy="60" r="4" fill="white"/>
    <path d="M44 32l8-8l8 8M76 32l-8-8l8 8M44 88l8 8l-8-8M76 88l-8 8l8-8" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Wordmark "SCOUT" -->
  <text x="60" y="105" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">SCOUT</text>
  <text x="60" y="117" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="rgba(255,255,255,0.7)" text-anchor="middle">AI</text>
</svg>
